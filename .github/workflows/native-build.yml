# 앱 빌드 확인: PR · 푸시마다 iOS(시뮬레이터용, 서명 없음)와 Android(디버그 APK)를 GitHub에서 빌드해요.
# Mac이 없어도 iOS 코드가 컴파일되는지 여기서 확인할 수 있어요.
name: 앱 빌드

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 진주 규칙 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  android:
    name: Android 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      - name: 디버그 APK 빌드
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: usukku-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: iOS 빌드 (시뮬레이터)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync ios
      - name: Xcode 버전
        run: xcodebuild -version
      - name: 시뮬레이터용 빌드 (서명 없음)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: 시뮬레이터 앱 묶기
        run: cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/usukku-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: usukku-ios-simulator-app
          path: usukku-ios-simulator.zip
          retention-days: 14
