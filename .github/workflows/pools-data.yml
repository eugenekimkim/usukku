# 전국 수영장 목록(js/pools-data.js)을 다시 만들어 이 브랜치에 커밋해요.
# 매달 1일 main에서 자동, 또는 Actions 탭에서 직접 실행, 또는 만드는 스크립트를 고쳐 푸시했을 때.
# 공공데이터포털 수영장업은 저장소 Settings > Secrets의 DATA_GO_KR_KEY(일반 인증키 Decoding)로 받아요 (2026-11-18 등록).
name: 수영장 목록

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 1 * *' # 매달 2일 03:17 (한국 시간)
  push:
    paths:
      - scripts/build-pools.mjs
      - .github/workflows/pools-data.yml

permissions:
  contents: write

concurrency:
  group: pools-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 수영장 목록 만들기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 목록 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/build-pools.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- js/pools-data.js scripts/pools-sample.json; then echo "바뀐 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pools-data.js scripts/pools-sample.json
          git commit -m "수영장 목록 갱신 ($(date +%Y-%m-%d))"
          git push
